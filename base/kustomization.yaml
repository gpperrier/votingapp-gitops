# Exemple complet de base/kustomization.yaml avec sync waves (remplace le fichier de la base).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - redis.yaml
  - db.yaml
  - vote.yaml
  - result.yaml
  - worker.yaml
  - ingress.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: voting-app
    includeSelectors: false
configMapGenerator:
  - name: vote-config
    literals:
      - OPTION_A=Cats
      - OPTION_B=Dogs
patches:
  # 0 (défaut) : redis et db. 1 : les consommateurs. 2 : l'exposition
  - patch: |-
      - op: add
        path: /metadata/annotations
        value: {"argocd.argoproj.io/sync-wave": "1"}
    target:
      kind: Deployment
      name: (vote|result|worker)
  - patch: |-
      - op: add
        path: /metadata/annotations
        value: {"argocd.argoproj.io/sync-wave": "2"}
    target:
      kind: Ingress
