apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vote-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: voting
  source:
    repoURL: https://github.com/gpperrier/votingapp-gitops.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: vote-dev
  syncPolicy:
    automated:
      prune: true        # supprime du cluster ce qui a disparu de Git
      selfHeal: true     # annule les modifications faites hors Git
    syncOptions:
      - CreateNamespace=true
